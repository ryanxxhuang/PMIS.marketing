          - generic [ref=f1e38]:
            - heading "風險警示" [level=3] [ref=f1e39]
            - paragraph [ref=f1e40]: 每日清晨由 AI 彙整：分級、分類、依據的文件與條號，以及兩個可以直接做的動作。分級高／中／低對應危險／注意／正常三種色票。
