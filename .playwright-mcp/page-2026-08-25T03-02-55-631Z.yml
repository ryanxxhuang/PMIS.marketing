            - heading "AI 今日已代辦" [level=3] [ref=f1e45]
            - paragraph [ref=f1e46]: 今天 AI 幫你擬了幾份日誌草稿、抽了幾條契約重點、比對了幾項估驗差異。每一項都能展開比對來源段落。
