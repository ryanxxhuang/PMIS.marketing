        - generic [ref=e291]: AI 的邊界
        - heading "AI 只做草稿" [level=2] [ref=e292]
        - paragraph [ref=e293]: 政府客戶第一個問題是「AI 會不會自己核定」。答案是不會，而且不是靠提示詞約束——Agent 的工具箱裡根本沒有核定、判定、結案與驗收這些工具。
      - generic [ref=e294]:
        - generic [ref=e295]:
          - generic [ref=e296]: 紅線 01
          - heading "AI 只產生草稿" [level=3] [ref=e297]
          - paragraph [ref=e298]: 核定、判定、結案、驗收、凍結——這些動作不在工具白名單裡。草稿寫入待覆核清單，由人接受或拒絕。
        - generic [ref=e299]:
          - generic [ref=e300]: 紅線 02
          - heading "數字由確定性引擎算" [level=3] [ref=e301]
          - paragraph [ref=e302]: 金額、期限與合格判定由程式或資料庫 Trigger 執行。AI 可以複述金額，但不自己乘除，也不編條號。
        - generic [ref=e303]:
          - generic [ref=e304]: 紅線 03
          - heading "每個動作都留痕" [level=3] [ref=e305]
          - paragraph [ref=e306]: 角色、種類、目標、理由、佐證與人的覆核結果都記下來。這同時是稽核軌跡，也是「AI 建議採納率」這個能對外交代的指標。
        - generic [ref=e307]:
          - generic [ref=e308]: 紅線 04
          - heading "每個 AI 功能可獨立開關" [level=3] [ref=e309]
          - paragraph [ref=e310]: 閘門在伺服器端，不是把前端按鈕藏起來。每次呼叫都記錄功能、使用者、專案與成本；出事能單獨關掉一個功能。
