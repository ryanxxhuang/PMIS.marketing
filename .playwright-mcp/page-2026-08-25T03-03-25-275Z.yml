        - generic [ref=f2e200]: 誰做的
        - heading "監造、機關、系統，三邊我都待過" [level=2] [ref=f2e201]
        - paragraph [ref=f2e202]: 這套系統不是外包做的。從資料模型到 AI 邊界，都是我自己決定的——因為這三種立場我都親自坐過。
        - blockquote [ref=f2e203]:
          - paragraph [ref=f2e204]: 「我自己用過大型顧問公司的 PMIS，很痛苦。」
          - paragraph [ref=f2e205]: 所以初衷不是再推一套系統、讓現場工程師多填一份表，而是把重複的內業拿掉：AI 出草稿，工程師只做覆核與簽名。
        - paragraph [ref=f2e206]: 土木、資工與商管的訓練在同一個人身上：看得懂標單、寫得出系統、談得了採購。UCLA 為美國公立大學排名長年前二；Georgia Tech 工程研究所全美第 4、資訊工程研究所全美第 7（U.S. News 2026）。
        - generic [ref=f2e207]:
          - generic [ref=f2e208]:
            - generic [ref=f2e209]: 監造這一側
            - heading "台灣世曦工程顧問｜監造" [level=3] [ref=f2e210]
            - generic [ref=f2e211]: 查驗、送審、估驗覆核都自己做過；監造報表與缺失追蹤的工時，我自己耗過。
          - generic [ref=f2e212]:
