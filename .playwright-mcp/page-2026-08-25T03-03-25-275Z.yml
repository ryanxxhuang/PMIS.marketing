    - generic [ref=f2e289]:
      - generic [ref=f2e290]:
        - generic [ref=f2e291]: AI 的邊界
        - heading "AI 只做草稿" [level=2] [ref=f2e292]
        - paragraph [ref=f2e293]: 政府客戶第一個問題是「AI 會不會自己核定」。答案是不會，而且不是靠提示詞約束——Agent 的工具箱裡根本沒有核定、判定、結案與驗收這些工具。
      - generic [ref=f2e294]:
        - generic [ref=f2e295]:
          - generic [ref=f2e296]: 紅線 01
          - heading "AI 只產生草稿" [level=3] [ref=f2e297]
          - paragraph [ref=f2e298]: 核定、判定、結案、驗收、凍結——這些動作不在工具白名單裡。草稿寫入待覆核清單，由人接受或拒絕。
        - generic [ref=f2e299]:
          - generic [ref=f2e300]: 紅線 02
          - heading "數字由確定性引擎算" [level=3] [ref=f2e301]
          - paragraph [ref=f2e302]: 金額、期限與合格判定由程式或資料庫 Trigger 執行。AI 可以複述金額，但不自己乘除，也不編條號。
        - generic [ref=f2e303]:
          - generic [ref=f2e304]: 紅線 03
          - heading "每個動作都留痕" [level=3] [ref=f2e305]
          - paragraph [ref=f2e306]: 角色、種類、目標、理由、佐證與人的覆核結果都記下來。這同時是稽核軌跡，也是「AI 建議採納率」這個能對外交代的指標。
        - generic [ref=f2e307]:
          - generic [ref=f2e308]: 紅線 04
          - heading "每個 AI 功能可獨立開關" [level=3] [ref=f2e309]
          - paragraph [ref=f2e310]: 閘門在伺服器端，不是把前端按鈕藏起來。每次呼叫都記錄功能、使用者、專案與成本；出事能單獨關掉一個功能。
      - generic [ref=f2e311]:
        - generic [ref=f2e312]: auto_awesome
        - paragraph [ref=f2e313]: 文件解析的結果也一樣：AI 抽出的履約要求標著信賴度與來源頁碼，只有經人審查、成為「已核定」要求後才具權威性。
    - generic [ref=f2e315]:
      - generic [ref=f2e316]:
        - generic [ref=f2e317]: 資安與稽核
        - heading "安全邊界寫在資料庫裡" [level=2] [ref=f2e318]
        - paragraph [ref=f2e319]: 權限不是前端隱藏按鈕。多租戶的資料列級安全性（RLS）、狀態轉移 Guard Trigger 與 Audit Trigger 是真正的邊界；前端隱藏只是體驗。
