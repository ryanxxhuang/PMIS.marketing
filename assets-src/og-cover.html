<!doctype html>
<!--
  GovAgent — Open Graph 封面（1080 × 1080）／算圖源檔
  ============================================================
  用途
    算成 public/og.png,供 Base.astro 的 <meta property="og:image"> 使用。

  來源
    design_handoff_pmis_marketing_site/社群輪播圖.dc.html 的第一張
    （data-screen-label="01"，深底封面）。文案、尺寸逐字沿用，
    只拿掉最後的「左滑 →」列 —— 那是輪播情境的 UI，OG 單張不適用。
    色值不再寫死:直接 <link> 站上的 global.css,吃 --dark-* 那組 token
    (行銷站深底段落 = 產品深色模式的值),token 改了、重算就跟上,不會再像
    2026-09 那樣停在 Google 舊色。品牌標記引用 public/brand/pmis-mark-dark.svg
    （深底版三色:頂=廠商、右下=監造、左下=機關），不在這裡再畫一份。

  位置
    刻意放在 assets-src/：不在 public/、也不在 src/pages/，
    所以 astro build 不會把它發佈出去，它只是算圖的源檔。

  再生成
    npm run render:assets   （scripts/render-assets.mjs,Playwright 無頭 Chromium）
    腳本會等 Noto Sans TC 真的載進來才截，載不到就失敗，不會悄悄出一張 fallback 字型的圖。

  字型
    與站上同一套 stack(global.css 的 --font-body / --font-display):Apple 平台
    英數是 SF,中文落到 Google Fonts 的 Noto Sans TC(需要網路)。
-->
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <title>GovAgent — OG 封面 1080 × 1080</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- token 的唯一來源;file:// 開啟時相對路徑照樣解析得到 -->
    <link rel="stylesheet" href="../src/styles/global.css" />
    <style>
      html {
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--dark-bg);
        color: var(--dark-text);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
      }

      /* 1080 × 1080 畫布：品牌列在上，文案靠下（margin-top:auto） */
      .cover {
        width: 1080px;
        height: 1080px;
        box-sizing: border-box;
        padding: 88px;
        background: var(--dark-bg);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        flex: none;
        display: block;
      }

      .brand-name {
        font-family: var(--font-heading);
        font-size: 32px;
        font-weight: 500;
      }

      .brand-name-ai {
        color: var(--dark-blue-text);
      }

      .copy {
        margin-top: auto;
      }

      /* 不叫 .kicker:global.css 的 .kicker 是段落節奏標記(前面帶 24px 橫線),這裡不要 */
      .cover-kicker {
        font-size: 26px;
        font-weight: 500;
        color: var(--dark-blue-text);
      }

      .headline {
        margin: 32px 0 0;
        font-family: var(--font-display);
        font-size: 92px;
        font-weight: 400;
        line-height: 1.16;
        letter-spacing: -0.02em;
        color: var(--dark-text);
      }

      .desc {
        margin: 40px 0 0;
        max-width: 760px;
        font-size: 30px;
        line-height: 1.7;
        color: var(--dark-text-2);
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <div class="brand">
        <img class="brand-mark" src="../public/brand/pmis-mark-dark.svg" width="40" height="40" alt="" />
        <span class="brand-name">PMIS<span class="brand-name-ai">.ai</span></span>
      </div>

      <div class="copy">
        <div class="cover-kicker">公共工程 · 三方協作</div>
        <h1 class="headline">同一個工程<br />三方看到三份<br />不一樣的數字</h1>
        <p class="desc">機關看契約、監造看查驗、廠商看估驗。對不起來的時候，開會對帳。</p>
      </div>
    </div>
  </body>
</html>
